<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Web 请求中的解析器与信任边界</title>
  <desc id="desc">同一请求依次经过浏览器、边缘组件、应用和数据服务；编码、身份与权限必须在各自边界重新解释和验证。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#55706f"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202b31}.h{font-size:19px;font-weight:650}.s{font-size:14px;fill:#59666c}.tiny{font-size:13px;fill:#7a5750}.box{fill:#fff;stroke:#cad4d1;stroke-width:1.5}.line{stroke:#55706f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="500" rx="18" fill="#fbfaf7"/>
  <g class="box">
    <rect x="35" y="150" width="165" height="110" rx="14"/><rect x="275" y="150" width="165" height="110" rx="14"/>
    <rect x="515" y="150" width="165" height="110" rx="14"/><rect x="755" y="150" width="165" height="110" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="117" y="188" class="h">浏览器</text><text x="117" y="216" class="s">URL · DOM · Cookie</text><text x="117" y="240" class="s">Origin · CSP</text>
    <text x="357" y="188" class="h">代理与服务器</text><text x="357" y="216" class="s">消息边界 · 缓存</text><text x="357" y="240" class="s">路径与 Host</text>
    <text x="597" y="188" class="h">框架与业务</text><text x="597" y="216" class="s">路由 · 参数 · 身份</text><text x="597" y="240" class="s">对象与状态机</text>
    <text x="837" y="188" class="h">数据与内网</text><text x="837" y="216" class="s">SQL · 文件 · API</text><text x="837" y="240" class="s">服务身份</text>
  </g>
  <path d="M200 205H275M440 205H515M680 205H755" class="line"/>
  <g stroke="#b56a50" stroke-width="2" stroke-dasharray="7 6">
    <path d="M235 85V355"/><path d="M475 85V355"/><path d="M715 85V355"/>
  </g>
  <g class="tiny" text-anchor="middle"><text x="235" y="73">解释边界</text><text x="475" y="73">信任边界</text><text x="715" y="73">权限边界</text></g>
  <rect x="145" y="390" width="670" height="62" rx="14" fill="#e9f2f0" stroke="#0f766e" stroke-width="1.5"/>
  <text x="480" y="417" text-anchor="middle" class="h">追踪 source → transform → sink</text>
  <text x="480" y="441" text-anchor="middle" class="s">每跨过一条边界，都重新确认规范化、身份、对象和权限语义</text>
</svg>
