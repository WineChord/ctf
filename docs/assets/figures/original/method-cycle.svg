<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">证据驱动的解题闭环</title>
  <desc id="desc">原始证据经过观察、假设、最小实验、交叉验证和复现，形成结论；失败会回到假设而不是被删除。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#55706f"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202b31}.h{font-size:19px;font-weight:650}.s{font-size:14px;fill:#59666c}.box{fill:#fff;stroke:#c8d2cf;stroke-width:1.5}.line{stroke:#55706f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="440" rx="18" fill="#fbfaf7"/>
  <g class="box">
    <rect x="55" y="175" width="150" height="86" rx="14"/><rect x="245" y="65" width="150" height="86" rx="14"/>
    <rect x="435" y="65" width="150" height="86" rx="14"/><rect x="625" y="175" width="150" height="86" rx="14"/>
    <rect x="435" y="285" width="150" height="86" rx="14"/><rect x="245" y="285" width="150" height="86" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="130" y="211" class="h">原始证据</text><text x="130" y="238" class="s">哈希 · 请求 · 字节</text>
    <text x="320" y="101" class="h">低成本观察</text><text x="320" y="128" class="s">只读、分层、留基线</text>
    <text x="510" y="101" class="h">可证伪假设</text><text x="510" y="128" class="s">写出支持与反证</text>
    <text x="700" y="211" class="h">最小实验</text><text x="700" y="238" class="s">一次只改变一项</text>
    <text x="510" y="321" class="h">交叉验证</text><text x="510" y="348" class="s">独立证据与对照</text>
    <text x="320" y="321" class="h">干净复现</text><text x="320" y="348" class="s">固定环境与判据</text>
  </g>
  <path d="M205 190L260 143M395 108H435M585 143L640 190M700 261L570 310M435 328H395M260 310L170 261" class="line"/>
  <rect x="365" y="188" width="230" height="60" rx="30" fill="#e8f2f0" stroke="#0f766e" stroke-width="1.7"/>
  <text x="480" y="224" text-anchor="middle" class="h">结论 = 证据 + 边界</text>
  <path d="M630 275C660 405 510 409 510 371" stroke="#ad6b53" stroke-width="1.7" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
  <text x="665" y="399" class="s" text-anchor="middle">失败结果也更新模型</text>
</svg>
