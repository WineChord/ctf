<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Writeup 在知识图谱中的位置</title>
  <desc id="desc">一篇题解把原始证据和关键观察连接到可复用原理，并继续指向变种、同构问题与防御设计。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#55706f"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202b31}.h{font-size:19px;font-weight:650}.s{font-size:14px;fill:#59666c}.box{fill:#fff;stroke:#cad4d1;stroke-width:1.5}.line{stroke:#55706f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="410" rx="18" fill="#fbfaf7"/>
  <rect x="355" y="155" width="250" height="100" rx="18" fill="#e9f2f0" stroke="#0f766e" stroke-width="1.8"/>
  <text x="480" y="196" text-anchor="middle" class="h">可复现 Writeup</text><text x="480" y="226" text-anchor="middle" class="s">证据、实验、边界与完整脚本</text>
  <g class="box">
    <rect x="55" y="55" width="195" height="74" rx="13"/><rect x="55" y="282" width="195" height="74" rx="13"/>
    <rect x="710" y="55" width="195" height="74" rx="13"/><rect x="710" y="282" width="195" height="74" rx="13"/>
  </g>
  <g text-anchor="middle">
    <text x="152" y="87" class="h">前置知识</text><text x="152" y="111" class="s">机器模型 · 协议 · 数学</text>
    <text x="152" y="314" class="h">原始证据</text><text x="152" y="338" class="s">附件 · 请求 · 参数</text>
    <text x="807" y="87" class="h">条件变种</text><text x="807" y="111" class="s">版本 · 保护 · 输入</text>
    <text x="807" y="314" class="h">防御与同构</text><text x="807" y="338" class="s">修复 · 检测 · 迁移</text>
  </g>
  <path d="M250 105L372 164M250 305L372 246M588 164L710 105M588 246L710 305" class="line"/>
  <text x="480" y="374" text-anchor="middle" class="s">索引按核心知识和证据类型组织，而不是按日期堆叠</text>
</svg>
