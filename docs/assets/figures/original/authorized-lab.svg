<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">授权范围与隔离实验环境</title>
  <desc id="desc">实验动作必须同时落在目标、授权、时间和动作范围内，并在资源受控、可回滚的隔离环境执行。</desc>
  <defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202b31}.h{font-size:20px;font-weight:650}.s{font-size:14px;fill:#59666c}.tag{font-size:16px;font-weight:600}.box{fill:#fff;stroke:#cad4d1;stroke-width:1.5}</style></defs>
  <rect width="960" height="430" rx="18" fill="#fbfaf7"/>
  <rect x="55" y="55" width="355" height="320" rx="20" fill="#f5f7f6" stroke="#829793" stroke-width="1.7"/>
  <text x="232" y="91" text-anchor="middle" class="h">授权边界</text>
  <g class="box">
    <rect x="85" y="120" width="130" height="68" rx="12"/><rect x="250" y="120" width="130" height="68" rx="12"/>
    <rect x="85" y="218" width="130" height="68" rx="12"/><rect x="250" y="218" width="130" height="68" rx="12"/>
  </g>
  <g class="tag" text-anchor="middle"><text x="150" y="161">目标</text><text x="315" y="161">授权</text><text x="150" y="259">时间</text><text x="315" y="259">动作</text></g>
  <text x="232" y="337" text-anchor="middle" class="s">四项同时明确，才进入主动测试</text>
  <path d="M440 215H515" stroke="#55706f" stroke-width="2.4"/><path d="M515 215L499 205V225Z" fill="#55706f"/>
  <rect x="550" y="55" width="355" height="320" rx="20" fill="#eaf3f1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="727" y="91" text-anchor="middle" class="h">隔离实验室</text>
  <rect x="590" y="125" width="275" height="165" rx="16" fill="#fff" stroke="#84aaa3" stroke-width="1.5"/>
  <rect x="625" y="160" width="205" height="78" rx="12" fill="#f4f8f7" stroke="#84aaa3"/>
  <text x="727" y="193" text-anchor="middle" class="tag">工作副本 / 快照</text>
  <text x="727" y="219" text-anchor="middle" class="s">本地或题目实例</text>
  <text x="727" y="321" text-anchor="middle" class="s">超时 · 速率 · CPU · 内存 · 网络受控</text>
  <path d="M590 300H865" stroke="#ad6b53" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="727" y="354" text-anchor="middle" class="s">边界之外：平台基础设施、第三方与真实数据</text>
</svg>
