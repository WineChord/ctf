<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">CTF 学习路线</title>
  <desc id="desc">学习从安全边界和共同基础出发，进入一个主方向，通过原理化复盘形成迁移能力。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52706d"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202b31}.n{font-size:15px;fill:#fff;font-weight:700}.h{font-size:20px;font-weight:650}.s{font-size:14px;fill:#59666c}.box{fill:#fff;stroke:#cad4d1;stroke-width:1.5}.line{stroke:#52706d;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="380" rx="18" fill="#fbfaf7"/>
  <path d="M150 180H310M390 180H550M630 180H790" class="line"/>
  <g>
    <circle cx="100" cy="180" r="31" fill="#0f766e"/><text x="100" y="186" text-anchor="middle" class="n">0</text>
    <rect x="30" y="225" width="140" height="74" rx="12" class="box"/><text x="100" y="253" text-anchor="middle" class="h">边界与环境</text><text x="100" y="279" text-anchor="middle" class="s">授权 · 隔离 · 保全</text>
    <circle cx="340" cy="180" r="31" fill="#2f6f9f"/><text x="340" y="186" text-anchor="middle" class="n">1</text>
    <rect x="260" y="62" width="160" height="74" rx="12" class="box"/><text x="340" y="90" text-anchor="middle" class="h">共同基础</text><text x="340" y="116" text-anchor="middle" class="s">字节 · 系统 · 网络</text>
    <circle cx="580" cy="180" r="31" fill="#946b25"/><text x="580" y="186" text-anchor="middle" class="n">2</text>
    <rect x="500" y="225" width="160" height="74" rx="12" class="box"/><text x="580" y="253" text-anchor="middle" class="h">主方向深挖</text><text x="580" y="279" text-anchor="middle" class="s">识别 · 解释 · 复现</text>
    <circle cx="820" cy="180" r="31" fill="#6b5b8c"/><text x="820" y="186" text-anchor="middle" class="n">3</text>
    <rect x="740" y="62" width="160" height="74" rx="12" class="box"/><text x="820" y="90" text-anchor="middle" class="h">迁移与复盘</text><text x="820" y="116" text-anchor="middle" class="s">变种 · 防御 · 关联</text>
  </g>
  <path d="M820 211C820 345 340 345 340 211" stroke="#9aa8a4" stroke-width="1.6" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/>
  <text x="580" y="350" text-anchor="middle" class="s">复盘暴露的基础缺口回流到下一轮学习</text>
</svg>
