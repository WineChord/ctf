<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Misc 题的低成本分类图</title>
  <desc id="desc">陌生对象先按载体、结构和任务类型分类，再选择格式解析、搜索优化、协议自动化或跨域分析路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#55706f"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202b31}.h{font-size:19px;font-weight:650}.s{font-size:14px;fill:#59666c}.box{fill:#fff;stroke:#cad4d1;stroke-width:1.5}.line{stroke:#55706f;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="470" rx="18" fill="#fbfaf7"/>
  <rect x="350" y="45" width="260" height="72" rx="16" fill="#e9f2f0" stroke="#0f766e" stroke-width="1.7"/>
  <text x="480" y="76" text-anchor="middle" class="h">这个对象能怎样被观察？</text><text x="480" y="101" text-anchor="middle" class="s">不先相信题目标签</text>
  <g class="box">
    <rect x="55" y="180" width="180" height="82" rx="14"/><rect x="275" y="180" width="180" height="82" rx="14"/>
    <rect x="505" y="180" width="180" height="82" rx="14"/><rect x="725" y="180" width="180" height="82" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="145" y="213" class="h">文本 / 字节</text><text x="145" y="239" class="s">字符集 · 长度 · 魔数</text>
    <text x="365" y="213" class="h">媒体 / 容器</text><text x="365" y="239" class="s">通道 · 帧 · 嵌套结构</text>
    <text x="595" y="213" class="h">交互协议</text><text x="595" y="239" class="s">边界 · 状态 · 超时</text>
    <text x="815" y="213" class="h">状态系统</text><text x="815" y="239" class="s">图搜索 · 模拟 · 约束</text>
  </g>
  <path d="M420 117L160 180M455 117L365 180M505 117L595 180M540 117L800 180" class="line"/>
  <rect x="145" y="345" width="670" height="72" rx="16" fill="#f4f6f5" stroke="#9aaba7" stroke-width="1.5"/>
  <text x="480" y="376" text-anchor="middle" class="h">标准格式？可离线？任务是还原、搜索、优化、模拟还是验证？</text>
  <text x="480" y="402" text-anchor="middle" class="s">用最小正确实现建立基线，再决定工具、算法和自动化程度</text>
  <path d="M145 262V345M365 262V345M595 262V345M815 262V345" class="line"/>
</svg>
