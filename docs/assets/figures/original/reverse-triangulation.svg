<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">逆向分析的证据三角</title>
  <desc id="desc">静态分析提供可能结构，动态分析提供特定执行状态，黑盒实验提供输入输出约束；三者共同校准语义模型。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#55706f"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202b31}.h{font-size:20px;font-weight:650}.s{font-size:14px;fill:#59666c}.line{stroke:#55706f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="460" rx="18" fill="#fbfaf7"/>
  <path d="M480 70L185 340H775Z" fill="#f5f7f6" stroke="#9aaba7" stroke-width="2"/>
  <circle cx="480" cy="91" r="66" fill="#dce9e6" stroke="#0f766e" stroke-width="1.7"/>
  <circle cx="205" cy="330" r="66" fill="#d7e3ee" stroke="#2f6f9f" stroke-width="1.7"/>
  <circle cx="755" cy="330" r="66" fill="#eadfca" stroke="#946b25" stroke-width="1.7"/>
  <g text-anchor="middle">
    <text x="480" y="87" class="h">静态分析</text><text x="480" y="113" class="s">可能路径与结构</text>
    <text x="205" y="326" class="h">动态分析</text><text x="205" y="352" class="s">这一次真实执行</text>
    <text x="755" y="326" class="h">黑盒实验</text><text x="755" y="352" class="s">输入输出约束</text>
  </g>
  <rect x="365" y="224" width="230" height="72" rx="36" fill="#fff" stroke="#6f8581" stroke-width="1.7"/>
  <text x="480" y="254" text-anchor="middle" class="h">可检验的语义模型</text>
  <text x="480" y="279" text-anchor="middle" class="s">数据流 · 状态机 · 算法</text>
  <path d="M445 155L455 223M270 315L365 275M690 315L595 275" class="line"/>
  <text x="480" y="423" text-anchor="middle" class="s">反编译变量名和类型是推断；中间值与行为对得上，模型才逐步变强</text>
</svg>
